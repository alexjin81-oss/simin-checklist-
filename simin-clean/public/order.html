<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="추가 오더">
<title>시민제과 추가 오더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --fg:#1f1b16; --muted:#6c655c; --line:#e3ded5;
  --accent:#b8692a; --accent-fg:#fff; --soft:#fbefe3; --good:#2f7d4f; --bad:#b8402f;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans KR','Noto Sans KR',-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150f;--card:#221e18;--fg:#f1ece4;--muted:#a39a8d;--line:#3a342b;--accent:#e0914c;--accent-fg:#17150f;--soft:#2c241a;--good:#6ec28f;--bad:#ec7f6c;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0)}
.wrap{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 160px max(16px,env(safe-area-inset-right))}
header{position:sticky;top:env(safe-area-inset-top,0);background:var(--bg);z-index:5;padding:12px 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 10px;font-weight:700}
h1 small{color:var(--muted);font-weight:500;font-size:12px;margin-left:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{min-width:0}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;flex:1}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 6px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search{margin:10px 0 4px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.cats button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px;font-weight:600}
.it{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.it .nm{font-weight:500}
.it.has .nm{color:var(--accent);font-weight:700}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer;font-family:var(--mono)}
.qty input{width:54px;text-align:center;font-family:var(--mono);padding:6px 4px;min-height:36px}
.empty{color:var(--muted);font-size:13px;padding:12px 0}
.out{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom,0)) max(16px,env(safe-area-inset-right));z-index:6}
.out .in{max-width:640px;margin:0 auto}
.out pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font:13px/1.5 var(--mono);max-height:22vh;overflow:auto}
.act{display:flex;gap:8px;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-fg);padding:11px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;flex:1}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);flex:0 0 auto}
.toast{font-size:13px;font-weight:600;min-height:18px;margin-top:6px}
.toast.ok{color:var(--good)}.toast.err{color:var(--bad)}
.note{margin-top:8px}
.setup{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.setup code{font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>추가 오더 <small>고른 것만 #물량에 올라갑니다</small></h1>
  <div class="row">
    <div class="seg" id="store" role="group" aria-label="매장">
      <button aria-pressed="true" data-v="본점">본점</button>
      <button aria-pressed="false" data-v="효자">효자</button>
      <button aria-pressed="false" data-v="롯데">롯데</button>
    </div>
    <div class="seg" id="round" role="group" aria-label="차수">
      <button aria-pressed="true" data-v="1차 13:30">1차</button>
      <button aria-pressed="false" data-v="2차 14:30">2차</button>
      <button aria-pressed="false" data-v="최종 15:00">최종</button>
    </div>
  </div>
  <div class="row" style="margin-top:8px">
    <input id="who" placeholder="작성자" aria-label="작성자" style="flex:1 1 120px">
  </div>
  <div class="cats" id="cats" role="tablist"></div>
  <input class="search" id="q" placeholder="제품 검색" aria-label="제품 검색">
</header>

<div id="setup" class="setup" hidden>
  슬랙 연결이 아직 안 됐어요. 대표가 설정에서 웹훅 주소를 한 번 넣어 주면 그 뒤로는 버튼 하나로 올라갑니다.
  <div class="row" style="margin-top:8px"><input id="hook" placeholder="https://hooks.slack.com/services/…"><button class="btn ghost" id="savehook">저장</button></div>
</div>

<div id="list"></div>
</div>

<div class="out"><div class="in">
  <pre id="preview" aria-live="polite"></pre>
  <div class="act">
    <button class="btn" id="send">#물량에 올리기</button>
    <button class="btn ghost" id="copy" title="복사">복사</button>
    <button class="btn ghost" id="reset">지우기</button>
  </div>
  <input class="note" id="note" placeholder="비고 (예: 본점 재고로 가능하면)">
  <div class="toast" id="toast"></div>
</div></div>

<script>
// 제품 목록 — 2026-04 통합 물량지 + 카톡방 추가 오더 품목. 순서 = 자주 추가되는 것부터.
const CATS = {
  "자주 추가":["단팥빵","생도너츠","팥도너츠","찹쌀도너츠","꽈배기","츄러스","전통고로케","찹쌀떡 (판)","찹쌀떡 4구","밤만쥬","명란바게트","통마늘바게트 (냉동 판)","쉐이크 (통)"],
  "대표빵":["단팥빵","소보로","호두소보로","슈크림","백앙금","버터크림빵","땅콩크림빵","생크림단팥빵"],
  "떡류":["찹쌀떡 (판)","찹쌀떡 4구","흑임자찹쌀떡","딸기떡","찹쌀떡 10구 도시락"],
  "대형빵":["연유바게트","통마늘바게트","명란바게트","검정고무신","맘모스빵","흑임자맘모스","모카빵"],
  "샌드위치·조리":["런치사라다","에그사라다","런치 오리지널","크로크무슈","메론거북이빵","초코거북이빵","야채빵","정구지빵","전통고로케","보스턴오코노미"],
  "도너츠·디저트":["팥도너츠","샌도너츠","찹쌀도너츠","찹쌀떡도너츠","생도너츠","꽈배기","츄러스","인절미크림빵","파이만쥬","모찌모찌","잠발라빼빠이","흑당호떡"],
  "소금빵·패스츄리":["소금빵 1차","소금빵 2차","솔티초코소금빵","크로와상","뺑스위스","연유파이","길쭉이트위스트"],
  "파이·구움":["밤파이","사과파이","피티비에","아몬드 스틱파이","쇼콜라 스틱파이","치즈스콘","초코스콘","밤만쥬","한입만쥬 (12구)","레몬케이크"],
  "치아바타·식빵":["올리브치아바타","포항초치아바타","블랙바질치아바타","우유식빵(소)","로프식빵","옥수수식빵","밤식빵","곡물탕종식빵","탕종식빵","데니쉬식빵"],
  "케이크·음료":["초코생크림 1호","초코생크림 2호","당근 1호","딸기 타르트","블루베리 타르트","자몽 타르트","쉐이크 (통)"]
};
const $=s=>document.querySelector(s);
const state={store:"본점",round:"1차 13:30",who:"",note:"",cat:"자주 추가",q:"",items:{}};
const KEY="simin-order";
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)Object.assign(state,s,{q:""});}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
// 슬랙 #물량 Incoming Webhook 주소. 여기에 넣으면 모든 매장 폰에서 바로 동작한다.
const HOOK_DEFAULT="";
let HOOK=HOOK_DEFAULT;if(!HOOK){try{HOOK=localStorage.getItem("simin-order-hook")||"";}catch(e){}}

function seg(id,key){const el=$(id);el.querySelectorAll("button").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.v===state[key]));b.onclick=()=>{state[key]=b.dataset.v;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render();};});}
seg("#store","store");seg("#round","round");
$("#who").value=state.who;$("#who").oninput=e=>{state.who=e.target.value;render();};
$("#note").value=state.note;$("#note").oninput=e=>{state.note=e.target.value;render();};
$("#q").oninput=e=>{state.q=e.target.value.trim();buildList();};

const cats=$("#cats");
Object.keys(CATS).forEach(c=>{const b=document.createElement("button");b.role="tab";b.textContent=c;b.setAttribute("aria-selected",String(c===state.cat));b.onclick=()=>{state.cat=c;state.q="";$("#q").value="";cats.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));buildList();save();};cats.appendChild(b);});

function row(name){
  const v=state.items[name]||0;
  const d=document.createElement("div");d.className="it"+(v?" has":"");
  d.innerHTML=`<div class="nm">${name}</div><div class="qty"><button aria-label="빼기">−</button><input inputmode="numeric" value="${v||""}" placeholder="0" aria-label="${name} 수량"><button aria-label="더하기">+</button></div>`;
  const [m,p]=d.querySelectorAll("button"),inp=d.querySelector("input");
  const set=n=>{n=Math.max(0,n|0);if(n)state.items[name]=n;else delete state.items[name];inp.value=n||"";d.classList.toggle("has",!!n);render();};
  m.onclick=()=>set((state.items[name]||0)-1);p.onclick=()=>set((state.items[name]||0)+1);inp.oninput=()=>set(+inp.value||0);
  return d;
}
function buildList(){
  const box=$("#list");box.innerHTML="";
  if(state.q){
    const seen=new Set();let any=false;
    for(const items of Object.values(CATS))for(const n of items){if(seen.has(n)||!n.includes(state.q))continue;seen.add(n);any=true;box.appendChild(row(n));}
    if(!any)box.innerHTML='<div class="empty">검색 결과가 없습니다</div>';
    return;
  }
  (CATS[state.cat]||[]).forEach(n=>box.appendChild(row(n)));
}
function message(){
  const rows=Object.entries(state.items).map(([n,v])=>`${n} ${v}`);
  if(!rows.length)return"";
  const who=state.who?` · 요청 ${state.who}`:"";
  return `추가오더 · ${state.store} · ${state.round}${who}\n${rows.join(" · ")}${state.note?`\n비고: ${state.note}`:""}\n생산: 접수하면 👀, 출고하면 ✅`;
}
function render(){
  const m=message();
  $("#preview").textContent=m||"제품을 골라 수량을 넣으면 여기에 미리 보여요.";
  $("#send").disabled=!m;
  $("#setup").hidden=!!HOOK;
  save();
}
$("#savehook").onclick=()=>{const v=$("#hook").value.trim();if(!v.startsWith("https://hooks.slack.com/"))return toast("hooks.slack.com 으로 시작하는 주소여야 해요","err");HOOK=v;try{localStorage.setItem("simin-order-hook",v);}catch(e){}toast("연결됐어요","ok");render();};
function toast(t,c){const el=$("#toast");el.textContent=t;el.className="toast "+(c||"");if(c==="ok")setTimeout(()=>{el.textContent="";},3000);}
$("#send").onclick=async()=>{
  const m=message();if(!m)return;
  if(!HOOK){$("#setup").hidden=false;$("#setup").scrollIntoView({behavior:"smooth"});return toast("슬랙 연결이 필요해요","err");}
  $("#send").disabled=true;toast("올리는 중…");
  try{
    // no-cors: Slack webhook accepts the post but the browser can't read the reply. Treat no network error as success.
    await fetch(HOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:JSON.stringify({text:m})});
    toast("#물량에 올렸어요","ok");
    state.items={};state.note="";$("#note").value="";buildList();render();
  }catch(e){toast("올리지 못했어요. 복사해서 직접 붙여 넣어 주세요","err");$("#send").disabled=false;}
};
$("#copy").onclick=async()=>{const m=message();if(!m)return;try{await navigator.clipboard.writeText(m);toast("복사됐어요","ok");}catch(e){toast("복사가 안 돼요","err");}};
$("#reset").onclick=()=>{state.items={};state.note="";$("#note").value="";buildList();render();};
buildList();render();
</script>
</body>
</html>
