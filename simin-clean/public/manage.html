<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6E2A2B">
<title>시민제과 관리</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  /* 시민제과 색: 팥(브랜드) × 밀크(바탕). 층마다 고유 색, 상태는 빨강·초록·주황 */
  :root {
    --pat: #6E2A2B; --pat-deep: #4B191C; --pat-tint: #F3E7E4; --gold: #F0D9A0;
    --bg: #FBF8F2; --card: #FFFFFF; --ink: #2B1D1B; --sub: #8A7873; --line: #E8DDD6;
    --ok: #2F7D4F; --ok-bg: #E8F3EC; --danger: #C4372B; --danger-bg: #FBEAE8;
    --warn: #C96A12; --warn-bg: #FCF0E1;
    --f2: #B4506B; --f3: #A67628; --f4: #3A6C8E;
    --floor: var(--pat);
  }
  body[data-role="2F"] { --floor: var(--f2); }
  body[data-role="3F"] { --floor: var(--f3); }
  body[data-role="4F"] { --floor: var(--f4); }
  [data-floor="2F"] { --c: var(--f2); } [data-floor="3F"] { --c: var(--f3); } [data-floor="4F"] { --c: var(--f4); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    font-size: 16px; line-height: 1.45;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 80px; }

  /* 헤더 */
  .top { text-align: center; padding: 8px 0 16px; }
  .top .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .top .date { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .badge {
    display: inline-block; background: var(--pat); color: #fff;
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    margin-top: 8px; letter-spacing: 0.3px;
  }

  /* 역할 선택 (프로토타입 전용) */
  .role-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 4px; }
  .role-pick button {
    padding: 18px 10px; border: 2px solid var(--line); background: var(--card);
    border-radius: 16px; font-size: 15px; font-weight: 700; color: var(--ink);
    cursor: pointer; font-family: inherit; transition: all 0.15s; line-height: 1.3;
  }
  .role-pick button .emo { font-size: 26px; display: block; margin-bottom: 6px; }
  .role-pick button .sub { font-size: 11px; color: var(--sub); font-weight: 500; display: block; margin-top: 2px; }
  .role-pick button:active { transform: scale(0.97); }
  .role-pick button.on { border-color: var(--pat); background: var(--warn-bg); }

  /* 진행률 바 */
  .progress-wrap { margin: 14px 0; }
  .progress-bar { height: 8px; background: var(--line); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--ok); border-radius: 10px; transition: width 0.3s; }
  .progress-label { font-size: 12px; color: var(--sub); margin-top: 6px; text-align: right; }

  /* 섹션 */
  .section { margin-bottom: 18px; }
  .section-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    padding-left: 2px;
  }
  .section-head .ico { font-size: 18px; }
  .section-head .title { font-size: 15px; font-weight: 800; }
  .section-head .time { font-size: 12px; color: var(--sub); margin-left: auto; }

  /* 체크 카드 */
  .check-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 14px; margin-bottom: 10px; transition: all 0.15s;
  }
  .check-card.done { background: var(--ok-bg); border-color: var(--ok); }
  .check-row { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
  .checkbox {
    width: 26px; height: 26px; border: 2px solid var(--line); border-radius: 8px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff; transition: all 0.15s; margin-top: 1px;
  }
  .check-card.done .checkbox { background: var(--ok); border-color: var(--ok); }
  .check-label { flex: 1; }
  .check-label .lbl { font-size: 15px; font-weight: 700; }
  .check-label .star { color: var(--danger); font-size: 13px; margin-left: 3px; }
  .check-label .hint { font-size: 12.5px; color: var(--sub); margin-top: 3px; line-height: 1.4; }
  .check-label .case {
    font-size: 12px; color: var(--warn); margin-top: 5px; line-height: 1.4;
    background: var(--warn-bg); padding: 7px 9px; border-radius: 8px;
  }

  /* 숫자 입력 (자재 등) */
  .num-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; padding-left: 38px; }
  .num-item label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 3px; }
  .num-item input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: #fff;
  }
  /* 메모 입력 */
  .memo-box { margin-top: 12px; padding-left: 38px; }

  /* 서브 체크 (워크인 등) */
  .subchecks { margin-top: 10px; padding-left: 38px; }
  .subcheck {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px;
    background: #fff; border: 1px solid var(--line); border-radius: 9px;
    margin-bottom: 6px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  }
  .subcheck.on { background: var(--ok-bg); border-color: var(--ok); }
  .subcheck .sbox {
    width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 6px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
  }
  .subcheck.on .sbox { background: var(--ok); border-color: var(--ok); }
  .memo-box textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; min-height: 60px; resize: vertical;
  }
  /* 리더 작성 현황 (부장용) */
  .floor-status { display: flex; gap: 8px; margin-top: 12px; padding-left: 38px; }
  .floor-chip {
    flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px;
    font-size: 12px; font-weight: 700; border: 1px solid var(--line);
  }
  .floor-chip.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .floor-chip.no { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

  /* 리더 재고 입력 */
  .inv-cat { margin-bottom: 16px; }
  .inv-cat-title {
    font-size: 13px; font-weight: 800; color: var(--pat); margin-bottom: 8px;
    padding-bottom: 4px; border-bottom: 2px solid var(--pat-tint);
  }
  .inv-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 76px 48px 34px; gap: 6px; align-items: center;
    padding: 8px 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 6px;
  }
  .inv-row.alert { border-color: var(--danger); background: var(--danger-bg); }
  .inv-row .name { font-size: 14px; font-weight: 600; }
  .inv-row .name .prev { font-size: 11px; color: var(--sub); font-weight: 400; display: block; }
  .inv-row input {
    width: 100%; padding: 8px 6px; border: 1px solid var(--line); border-radius: 7px;
    font-size: 15px; text-align: center; font-family: inherit; background: #fff;
  }
  .inv-row .safe { font-size: 11px; color: var(--sub); text-align: center; }
  .inv-row .badge-alert {
    font-size: 10px; font-weight: 800; color: var(--danger); text-align: center;
  }
  .inv-head {
    display: grid; grid-template-columns: minmax(0, 1fr) 76px 48px 34px; gap: 6px;
    font-size: 11px; color: var(--sub); font-weight: 700; padding: 0 10px 4px;
  }
  .inv-head div:not(:first-child) { text-align: center; }

  .carry-note {
    background: var(--pat-tint); border-radius: 10px; padding: 10px 12px;
    font-size: 12.5px; color: var(--ink); margin-bottom: 12px; line-height: 1.45;
  }
  .carry-note b { color: var(--pat); }

  /* 품목 직접 추가 */
  .extra-box { margin-top: 10px; }
  .extra-row { display: grid; grid-template-columns: 1fr 80px 40px; gap: 8px; margin-bottom: 8px; }
  .extra-row input {
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff;
  }
  .extra-row .del {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    color: var(--sub); cursor: pointer; font-size: 16px;
  }
  .add-btn {
    width: 100%; padding: 11px; background: #fff; border: 1.5px dashed var(--pat);
    border-radius: 10px; color: var(--pat); font-size: 13.5px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .add-hint { font-size: 11.5px; color: var(--sub); margin-top: 7px; line-height: 1.4; }

  /* 제출 버튼 */
  .submit-btn {
    width: 100%; padding: 16px; background: var(--pat); color: #fff; border: none;
    border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; margin-top: 8px; position: sticky; bottom: 16px;
    box-shadow: 0 4px 16px rgba(110,42,43,0.3);
  }
  .submit-btn:active { transform: scale(0.99); }

  .back-btn {
    background: none; border: none; color: var(--sub); font-size: 14px;
    cursor: pointer; font-family: inherit; padding: 4px 0; margin-bottom: 4px;
  }
  .hidden { display: none !important; }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 14px 22px; border-radius: 30px;
    font-size: 14px; z-index: 100; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; max-width: 90%; text-align: center; font-weight: 600;
  }
  .toast.show { opacity: 1; }
  /* 대표 지시사항 박스 */
  .notice-box {
    background: linear-gradient(135deg, var(--pat-deep), var(--pat));
    color: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(75,25,28,0.25);
  }
  .notice-box .notice-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 8px;
    letter-spacing: 0.3px;
  }
  .notice-box .notice-body { font-size: 15px; line-height: 1.5; white-space: pre-wrap; font-weight: 600; }
  .notice-box .notice-date { font-size: 11px; color: #E6CFCB; margin-top: 8px; text-align: right; }
  .notice-box.empty .notice-body { color: #DCC3BE; font-weight: 400; font-size: 13px; }

  /* 대표 작성 화면 */
  .ceo-edit { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .ceo-edit label { font-size: 13px; font-weight: 700; color: var(--ink); display: block; margin-bottom: 8px; }
  .ceo-edit textarea {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    font-size: 15px; font-family: inherit; background: #fff; min-height: 120px; resize: vertical;
    line-height: 1.5;
  }
  .ceo-edit .ceo-hint { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.4; }

  /* ---------- 2026-10 추가 ---------- */
  body { border-top: 6px solid var(--floor); transition: border-color 0.2s; }
  .top .logo { color: var(--pat); }
  .role-guide { font-size: 13px; color: var(--sub); text-align: center; margin-bottom: 4px; }
  .role-pick button[data-floor] { border-bottom: 5px solid var(--c); }
  .role-band {
    display: flex; align-items: center; gap: 8px; padding: 11px 14px; margin: 6px 0 14px;
    border-radius: 12px; background: var(--floor); color: #fff; font-size: 17px; font-weight: 800;
  }
  .role-band .emo { font-size: 20px; }
  .loading-note { text-align: center; color: var(--sub); font-size: 14px; padding: 40px 0; }
  .link-btn {
    background: none; border: none; color: var(--sub); font-size: 12.5px; font-family: inherit;
    cursor: pointer; padding: 8px 0 0 38px; text-decoration: underline;
  }
  .floor-chip.part { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .floor-chip.wait { background: #fff; color: var(--sub); }

  /* 리더 재고 */
  .inv-cat-title { color: var(--floor); border-bottom-color: var(--line); }
  .inv-row { border-left: 4px solid var(--line); }
  .inv-row.done { border-left-color: var(--ok); }
  .inv-row.alert { border-left-color: var(--danger); }
  .inv-row.pending { border-color: var(--warn); background: var(--warn-bg); }
  .inv-row .name { overflow-wrap: anywhere; }
  .inv-row input { padding: 8px 2px; }
  .inv-row input::placeholder { color: #C9BCB6; font-size: 13px; }
  /* 지시사항이 없을 때는 조용하게 */
  .notice-box.empty { background: var(--pat-tint); box-shadow: none; padding: 10px 14px; }
  .notice-box.empty .notice-head { color: var(--pat); margin-bottom: 2px; }
  .notice-box.empty .notice-body { color: var(--sub); }
  .same-btn {
    padding: 9px 0; border: 1px solid var(--line); background: #fff; border-radius: 7px;
    font-size: 12.5px; font-weight: 700; color: var(--sub); font-family: inherit; cursor: pointer;
  }
  .same-btn.on { background: var(--pat); border-color: var(--pat); color: #fff; }
  .same-btn:disabled { opacity: 0.35; cursor: default; }
  .inv-row .st { font-size: 11px; color: var(--sub); text-align: center; }
  .badge-ok { color: var(--ok); font-weight: 800; font-size: 14px; }
  .badge-warn { color: var(--warn); font-weight: 800; font-size: 10px; }
  .inv-warn {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 8px;
    padding: 9px 10px; border-radius: 10px; background: var(--warn-bg); border: 1px solid var(--warn);
    font-size: 13px; color: var(--ink); line-height: 1.4;
  }
  .inv-warn span { flex: 1 1 150px; }
  .inv-warn button {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--warn); background: #fff;
    color: var(--warn); font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .inv-warn button:first-of-type { background: var(--warn); color: #fff; }
  .carry-note.warn { background: var(--warn-bg); }
  .carry-note.warn b { color: var(--warn); }

  /* 비밀번호 입력 */
  .sheet {
    position: fixed; inset: 0; z-index: 200; background: rgba(43,29,27,0.55);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .sheet-card { width: 100%; max-width: 320px; background: #fff; border-radius: 18px; padding: 22px 20px 18px; }
  .sheet-title { font-size: 16px; font-weight: 800; color: var(--pat); margin-bottom: 12px; }
  .sheet-card input {
    width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px;
    font-size: 18px; font-family: inherit; letter-spacing: 3px; text-align: center;
  }
  .sheet-err { min-height: 20px; font-size: 13px; color: var(--danger); margin-top: 8px; text-align: center; }
  .sheet-btns { display: flex; gap: 8px; margin-top: 10px; }
  .sheet-btns button {
    flex: 1; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: #fff;
    font-size: 15px; font-weight: 700; font-family: inherit; color: var(--sub); cursor: pointer;
  }
  .sheet-btns button.primary { background: var(--pat); border-color: var(--pat); color: #fff; }

  .submit-btn:disabled { opacity: 0.6; }
  .toast.error { background: var(--danger); }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--pat); outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="logo">시민제과 관리</div>
    <div class="date" id="dateLabel"></div>
  </div>

  <!-- 역할 선택 -->
  <div id="roleView">
    <div class="role-guide">본인 역할을 선택하세요</div>
    <div class="role-pick">
      <button onclick="enterRole('ceo')">
        <span class="emo">🧭</span>대표<span class="sub">지시사항 작성</span>
      </button>
      <button onclick="enterRole('supervisor')">
        <span class="emo">📋</span>부장<span class="sub">일일 점검</span>
      </button>
      <button onclick="enterRole('2F')" data-floor="2F">
        <span class="emo">🎂</span>2F 케이크실<span class="sub">재고 입력</span>
      </button>
      <button onclick="enterRole('3F')" data-floor="3F">
        <span class="emo">🍞</span>3F 생산실<span class="sub">재고 입력</span>
      </button>
      <button onclick="enterRole('4F')" data-floor="4F">
        <span class="emo">❄️</span>4F 냉동생지<span class="sub">재고 입력</span>
      </button>
    </div>
  </div>

  <!-- 콘텐츠 영역 -->
  <div id="contentView" class="hidden">
    <button class="back-btn" onclick="goBack()">← 역할 다시 선택</button>
    <div class="role-band" id="roleBand"></div>
    <div id="noticeSlot"></div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
    <div id="sections"></div>
    <button class="submit-btn" id="submitBtn" onclick="submitForm()">저장</button>
  </div>
</div>

<!-- 비밀번호 입력 -->
<div class="sheet hidden" id="pinSheet">
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <div class="sheet-title" id="pinTitle">비밀번호</div>
    <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="비밀번호 입력">
    <div class="sheet-err" id="pinErr"></div>
    <div class="sheet-btns">
      <button type="button" id="pinCancel">취소</button>
      <button type="button" id="pinOk" class="primary">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// 데이터 정의
// ============================================

// 부장 일일 점검표
const SUPERVISOR = [
  { id: 'am', title: '아침', ico: '🌅', time: '~09:00', items: [
    { id: 's1', label: '조회 진행', star: true,
      hint: '각 층 당일 작업 확인' },
    { id: 's2', label: '전날 폐기 데이터 확인', star: true,
      hint: '웹앱 기록에서 전날 폐기 확인 · 사유가 실제와 맞는지 점검',
      memo: '폐기 관련 메모' },
  ]},
  { id: 'amround', title: '오전 라운딩', ico: '🥐', time: '~10:30', items: [
    { id: 's3', label: '2F 케이크실', star: true,
      hint: '직원 기록 · 당일 케이크 품질 · 사전예약 공유',
      checks: ['워크인 냉동고(1) 정리·재고 확인'],
      memo: '워크인 정리 필요·오래된 재고 발견 시 (선택)' },
    { id: 's4', label: '3F 빵·떡', star: true,
      hint: '직원 기록 · 떡·바게트 진행',
      checks: ['워크인 냉동고(1) 정리·재고 확인', '워크인 냉장고(1) 정리·재고 확인'],
      memo: '워크인 정리 필요·오래된 재고 발견 시 (선택)' },
    { id: 's5', label: '4F 냉동생지', star: true,
      hint: '직원 기록 · 반죽 해동 일지',
      checks: ['워크인 냉동고 ① 정리·재고 확인', '워크인 냉동고 ② 정리·재고 확인'],
      memo: '워크인 정리 필요·오래된 재고 발견 시 (선택)' },
    { id: 'sq', label: '주요 제품 품질 확인', star: true,

function $(id) { return document.getElementById(id); }

const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
// 한국 날짜 (기기 시간대와 상관없이)
function kstDay(offsetDays) {
  const d = new Date(Date.now() + 9 * 3600 * 1000 - (offsetDays || 0) * 86400 * 1000);
  return {
    iso: d.toISOString().slice(0, 10),
    label: (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 (' + DAY_NAMES[d.getUTCDay()] + ')'
  };
}
$('dateLabel').textContent = kstDay(0).label;

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function fmtNum(n) { return Number(n).toLocaleString('ko-KR'); }
function fmtMD(iso) { const p = String(iso || '').split('-'); return p.length === 3 ? Number(p[1]) + '/' + Number(p[2]) : ''; }
// 품목명 비교용: "[추가]" 표시와 띄어쓰기 차이를 무시 (서버와 같은 규칙)
function normName(s) {
  return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().replace(/^\[추가\]\s*/, '').replace(/\s+/g, '').toLowerCase();
}

let toastTimer = null;
function toast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, isError ? 3500 : 2400);
}

// 작성 중인 내용은 이 기기에 날짜별로 보관한다 (새로고침·화면 이동에도 유지)
function draftKey(r) { return 'simin_manage_' + r + '_' + kstDay(0).iso; }
function loadDraft(r) {
  try { return JSON.parse(localStorage.getItem(draftKey(r)) || 'null'); } catch (e) { return null; }
}
function saveDraft(r, data) {
  try { localStorage.setItem(draftKey(r), JSON.stringify(data)); } catch (e) {}
}
function clearDraft(r) { try { localStorage.removeItem(draftKey(r)); } catch (e) {} }
(function dropOldDrafts() {
  try {
    const today = kstDay(0).iso;
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.indexOf('simin_manage_') === 0 && k.slice(-10) !== today) localStorage.removeItem(k);
    }
  } catch (e) {}
})();

function getPin(r) { try { return sessionStorage.getItem('simin_pin_' + r) || ''; } catch (e) { return ''; } }
function setPin(r, pin) { try { pin ? sessionStorage.setItem('simin_pin_' + r, pin) : sessionStorage.removeItem('simin_pin_' + r); } catch (e) {} }

function askPin(r) {
  return new Promise(resolve => {
    const sheet = $('pinSheet'), input = $('pinInput'), err = $('pinErr'), ok = $('pinOk');
    $('pinTitle').textContent = PIN_ROLES[r] + ' 비밀번호';
    input.value = ''; err.textContent = '';
    sheet.classList.remove('hidden');
    setTimeout(() => input.focus(), 50);

    function close(result) {
      sheet.classList.add('hidden');
      ok.onclick = null; $('pinCancel').onclick = null; input.onkeydown = null;
      resolve(result);
    }
    async function submit() {
      const pin = input.value.trim();
      if (!pin) { err.textContent = '비밀번호를 입력해주세요'; return; }
      ok.disabled = true; err.textContent = '확인 중…';
      try {
        const res = await api({ action: 'checkPin', role: r, pin: pin });
        if (res.ok) { setPin(r, pin); close(pin); }
        else { err.textContent = res.error || '확인하지 못했습니다'; input.value = ''; input.focus(); }
      } catch (e) {
        err.textContent = '네트워크 오류 — 다시 시도해주세요';
      } finally { ok.disabled = false; }
    }
    ok.onclick = submit;
    $('pinCancel').onclick = () => close(null);
    input.onkeydown = e => { if (e.key === 'Enter') submit(); };
  });
}

async function enterRole(r) {
  let pin = null;
  if (PIN_ROLES[r]) {
    pin = getPin(r) || await askPin(r);
    if (!pin) return;
  }

  role = r;
  document.body.dataset.role = r;
  $('roleView').classList.add('hidden');
  $('contentView').classList.remove('hidden');
  $('roleBand').innerHTML = '<span class="emo">' + ROLE_INFO[r].emo + '</span>' + escapeHtml(ROLE_INFO[r].title);
  $('sections').innerHTML = '<div class="loading-note">불러오는 중…</div>';
  $('submitBtn').classList.add('hidden');
  $('progressWrap').classList.add('hidden');
  $('noticeSlot').innerHTML = '';
  window.scrollTo(0, 0);

  // 대표 지시사항
  try {
    const res = await api({ action: 'getNotice' });
    if (res.ok) ceoNotice = { text: res.text || '', date: res.date || '' };
  } catch (e) {}
  if (role !== r) return;   // 불러오는 사이 다른 화면으로 이동

  if (r === 'ceo') {
    renderCeoEdit();
    $('submitBtn').textContent = '지시사항 저장';
  } else if (r === 'supervisor') {
    renderNoticeBox();
    const d = loadDraft('supervisor') || {};
    checkState = d.checkState || {};
    fieldState = d.fieldState || {};
    floorStatus = null;
    renderSupervisor();
    $('progressWrap').classList.remove('hidden');
    updateProgress();
    loadFloorStatus();
  } else {
    renderNoticeBox();
    await loadInventory(r);
    if (role !== r) return;
    renderLeader(r);
    $('progressWrap').classList.remove('hidden');
    updateProgress();
  }
  $('submitBtn').classList.remove('hidden');
}

  SUPERVISOR.forEach(sec => {

      if (it.hint) html += `<div class="hint">${it.hint}</div>`;
      html += `</div></div>`;
      // 서브 체크 (워크인 등)
      if (it.checks) {
        html += `<div class="subchecks">`;
        it.checks.forEach((label, idx) => {
          const sid = `${it.id}-sub${idx}`;
          html += `<div class="subcheck${checkState['sub-' + sid] ? ' on' : ''}" id="sub-${sid}" onclick="toggleSub(event, '${sid}')">` +
            `<div class="sbox">✓</div><span>${label}</span></div>`;
        });
        html += `</div>`;
      }
      // 숫자 입력
      if (it.nums) {
        html += `<div class="num-grid">`;
        it.nums.forEach(n => {
          html += `<div class="num-item"><label for="num-${it.id}-${n.k}">${n.label}</label>` +
            `<input type="number" inputmode="decimal" id="num-${it.id}-${n.k}" placeholder="0" oninput="onField(this)"></div>`;
        });
        html += `</div>`;
      }
      // 메모
      if (it.memo) {
        html += `<div class="memo-box"><textarea id="memo-${it.id}" placeholder="${escapeHtml(it.memo)}" oninput="onField(this)"></textarea></div>`;
      }
      // 층별 리더 재고 입력 현황 (실제 저장 여부)
      if (it.floors) {
        html += `<div class="floor-status" id="floorStatus"></div>` +
          `<button type="button" class="link-btn" onclick="loadFloorStatus()">↻ 현황 새로고침</button>`;
      }
      html += `</div>`;
    });
    secEl.innerHTML = html;
    c.appendChild(secEl);
  });
  // 보관해 둔 입력값 되살리기
  Object.keys(fieldState).forEach(id => { const el = $(id); if (el) el.value = fieldState[id]; });
  renderFloorStatus();
}

function onField(el) {
  fieldState[el.id] = el.value;
  persistSupervisor();
}

function toggleCheck(id) {
  checkState[id] = !checkState[id];
  $('card-' + id).classList.toggle('done', checkState[id]);
  persistSupervisor();
  updateProgress();
}

function toggleSub(e, sid) {
  if (e) e.stopPropagation();
  checkState['sub-' + sid] = !checkState['sub-' + sid];
  $('sub-' + sid).classList.toggle('on', checkState['sub-' + sid]);
  persistSupervisor();
}

function floorTotal(floor) {
  return LEADER_INV[floor].cats.reduce((n, cat) => n + cat.items.length, 0);
}

async function loadFloorStatus() {
  floorStatus = null;
  renderFloorStatus();
  try {
    const res = await api({ action: 'getStatus' });
    floorStatus = (res.ok && res.floors) ? res.floors : { error: true };
  } catch (e) {
    floorStatus = { error: true };
  }
  renderFloorStatus();
}

function renderFloorStatus() {
  const box = $('floorStatus');
  if (!box) return;
  box.innerHTML = ['2F', '3F', '4F'].map(f => {
    if (!floorStatus) return `<div class="floor-chip wait">${f} 확인 중…</div>`;
    if (floorStatus.error || !floorStatus[f]) return `<div class="floor-chip wait">${f} 확인 불가</div>`;
    const st = floorStatus[f], total = floorTotal(f);
    if (!st.saved) return `<div class="floor-chip no">${f} 미작성</div>`;
    if (st.count >= total) return `<div class="floor-chip ok">${f} ✓ 완료</div>`;
    return `<div class="floor-chip part">${f} ${st.count}/${total}</div>`;
  }).join('');
}

// ============================================
// 리더 재고 화면
// ============================================
function leaderItems(floor) { return LEADER_INV[floor].cats.flatMap(cat => cat.items); }

function persistLeader() {
  if (!LEADER_INV[role]) return;
  const dirty = {};
  Object.keys(inv).forEach(k => { if (inv[k].mode === 'typed' || inv[k].mode === 'same') dirty[k] = inv[k]; });
  saveDraft(role, { inv: dirty });
}

// 서버에서 "오늘 이전의 마지막 재고"와 "오늘 이미 저장한 재고"를 불러온다
async function loadInventory(floor) {
  inv = {}; invMeta = {}; invLoaded = true;
  let res = null;
  try { res = await api({ action: 'getInventory', floor: floor }); } catch (e) {}
  if (!res || !res.ok) { invLoaded = false; res = {}; }

  const prev = res.prev || {};
  const today = res.today || {};
  const yesterday = res.yesterday || kstDay(1).iso;

  leaderItems(floor).forEach(it => {
    const key = normName(it.name);
    let p = prev[key];
    if (!p && !res.prev && res.items && res.items[it.name] !== undefined && res.items[it.name] !== '') {
      p = { v: res.items[it.name], d: '' };            // 구버전 서버 응답
    }
    const pv = p ? Number(p.v) : NaN;
    invMeta[it.k] = {
      name: it.name, safe: it.safe,
      prev: isNaN(pv) ? null : pv,
      prevDate: p ? p.d : '',
      prevIsYesterday: !!(p && p.d === yesterday)
    };
    const tv = today[key] === undefined || today[key] === '' ? NaN : Number(today[key]);
    inv[it.k] = isNaN(tv) ? { v: null, mode: null, ack: false, warn: false }
                          : { v: tv, mode: 'today', ack: true, warn: false };
  });

  // 이 기기에서 입력하다 만 값이 있으면 되살린다
  const d = loadDraft(floor);
  if (d && d.inv) {
    Object.keys(d.inv).forEach(k => {
      const s = d.inv[k];
      if (inv[k] && s && (s.mode === 'typed' || s.mode === 'same') && s.v !== null && !isNaN(Number(s.v))) {
        inv[k] = { v: Number(s.v), mode: s.mode, ack: !!s.ack, warn: false };
      }
    });
  }
}

function prevText(m) {
  if (m.prev === null) return '이전 기록 없음';
  const when = m.prevIsYesterday ? '어제' : (fmtMD(m.prevDate) || '지난 기록');
  return when + ' ' + fmtNum(m.prev);
}

function renderLeader(floor) {
  const data = LEADER_INV[floor];
  const c = $('sections');
  c.innerHTML = '';

  const note = document.createElement('div');
  note.className = 'carry-note' + (invLoaded ? '' : ' warn');
  const savedToday = Object.keys(inv).some(k => inv[k].mode === 'today');
  note.innerHTML = !invLoaded
    ? `<b>지난 재고를 불러오지 못했어요.</b> 숫자는 그대로 입력할 수 있습니다. 연결이 되면 새로고침해 주세요.`
    : savedToday
      ? `<b>오늘 저장한 재고</b>가 채워져 있어요. 바뀐 품목만 고치고 다시 저장하면 됩니다.`
      : `<b>오늘 실제 재고</b>를 세어서 입력해 주세요. 변동이 없으면 <b>같음</b>을 누르면 됩니다. 입력하지 않은 품목은 저장되지 않아요.`;
  c.appendChild(note);

  data.cats.forEach(cat => {
    const catEl = document.createElement('div');
    catEl.className = 'inv-cat';
    let html = `<div class="inv-cat-title">${escapeHtml(cat.cat)}</div>`;
    html += `<div class="inv-head"><div>품목</div><div>오늘 재고</div><div>변동 없음</div><div>안전</div></div>`;
    cat.items.forEach(it => {
      const m = invMeta[it.k], s = inv[it.k];
      const nm = escapeHtml(it.name);
      html += `<div class="inv-row" id="inv-${it.k}">` +
        `<div class="name">${nm}<span class="prev">${escapeHtml(prevText(m))}</span></div>` +
        `<input type="number" inputmode="decimal" min="0" step="any" id="in-${it.k}" value="${s.v === null ? '' : s.v}" ` +
          `placeholder="입력" aria-label="${nm} 오늘 재고" oninput="onInvInput('${it.k}', this)" onchange="onInvCommit('${it.k}')">` +
        `<button type="button" class="same-btn" id="same-${it.k}" onclick="onSame('${it.k}')" ` +
          `${m.prev === null ? 'disabled' : ''} aria-label="${nm} ${m.prev === null ? '이전 기록 없음' : '지난 재고와 같음'}">같음</button>` +
        `<div class="st" id="st-${it.k}"></div>` +
        `</div><div class="inv-warn hidden" id="warn-${it.k}"></div>`;
    });
    catEl.innerHTML = html;
    c.appendChild(catEl);
  });

  // 품목 직접 추가 (모든 층)
  const extraEl = document.createElement('div');
  extraEl.className = 'inv-cat';
  extraEl.innerHTML = `<div class="inv-cat-title">목록에 없는 품목</div>` +
    `<div class="extra-box" id="extraBox"></div>` +
    `<button type="button" class="add-btn" onclick="addExtraRow()">＋ 품목 추가</button>` +
    `<div class="add-hint">신제품이나 빠진 품목을 적어주세요. 자주 추가되는 품목은 정식 목록에 넣습니다.</div>`;
  c.appendChild(extraEl);

  Object.keys(inv).forEach(paintRow);
}

// 평소와 크게 다른 숫자인지 (오타 방지용)
function isOutlier(v, prev) {
  if (v === null) return false;
  if (v >= 10000) return true;
  if (prev === null || prev <= 0 || v <= 0) return false;
  const big = Math.max(v, prev), small = Math.min(v, prev);
  return big >= 50 && big >= small * 5;
}

function paintRow(k) {
  const s = inv[k], m = invMeta[k], row = $('inv-' + k);
  if (!row) return;
  const has = s.v !== null;
  const alert = has && s.v < m.safe;
  row.classList.toggle('done', has && !s.warn && !alert);
  row.classList.toggle('alert', alert && !s.warn);
  row.classList.toggle('pending', !!s.warn);
  $('same-' + k).classList.toggle('on', s.mode === 'same');

  const st = $('st-' + k);
  if (s.warn) st.innerHTML = `<span class="badge-warn">확인</span>`;
  else if (alert) st.innerHTML = `<span class="badge-alert">긴급</span>`;
  else if (has) st.innerHTML = `<span class="badge-ok">✓</span>`;
  else st.textContent = m.safe;

  const w = $('warn-' + k);
  if (s.warn) {
    const from = m.prev === null ? '' : `${prevText(m)} → `;
    w.innerHTML = `<span>${escapeHtml(from)}오늘 <b>${fmtNum(s.v)}</b>, 맞나요?</span>` +
      `<button type="button" onclick="ackWarn('${k}')">맞아요</button>` +
      `<button type="button" onclick="retype('${k}')">다시 입력</button>`;
    w.classList.remove('hidden');
  } else {
    w.classList.add('hidden'); w.innerHTML = '';
  }
}

function onInvInput(k, input) {
  const raw = input.value.trim();
  const v = raw === '' ? NaN : Number(raw);
  inv[k] = isNaN(v) || v < 0 ? { v: null, mode: null, ack: false, warn: false }
                             : { v: v, mode: 'typed', ack: false, warn: false };
  paintRow(k);
  updateProgress();
}

// 입력을 마쳤을 때(칸을 벗어날 때) 급변 여부를 확인한다
function onInvCommit(k) {
  const s = inv[k];
  if (s.mode === 'typed' && !s.ack) s.warn = isOutlier(s.v, invMeta[k].prev);
  paintRow(k);
  persistLeader();
}

function onSame(k) {
  const m = invMeta[k];
  if (m.prev === null) return;
  if (inv[k].mode === 'same') inv[k] = { v: null, mode: null, ack: false, warn: false };
  else inv[k] = { v: m.prev, mode: 'same', ack: true, warn: false };
  $('in-' + k).value = inv[k].v === null ? '' : inv[k].v;
  paintRow(k);
  updateProgress();
  persistLeader();
}

function ackWarn(k) {
  inv[k].ack = true; inv[k].warn = false;
  paintRow(k);
  persistLeader();
}

function retype(k) {
  inv[k] = { v: null, mode: null, ack: false, warn: false };
  const input = $('in-' + k);
  input.value = '';
  paintRow(k);
  updateProgress();
  persistLeader();
  input.focus();
}

let extraCount = 0;
function addExtraRow() {
  extraCount++;
  const row = document.createElement('div');
  row.className = 'extra-row';
  row.id = 'extra-' + extraCount;
  row.innerHTML = `<input type="text" placeholder="품목명" aria-label="추가 품목명">` +
    `<input type="number" inputmode="decimal" min="0" step="any" placeholder="수량" aria-label="추가 품목 수량">` +
    `<button type="button" class="del" onclick="delExtraRow(${extraCount})" aria-label="이 줄 삭제">✕</button>`;
  $('extraBox').appendChild(row);
  row.querySelector('input').focus();
}
function delExtraRow(id) {
  const row = $('extra-' + id);
  if (row) row.remove();
}

// ============================================
// 진행률 · 저장 버튼 문구
// ============================================
function updateProgress() {
  const btn = $('submitBtn');
  if (role === 'supervisor') {
    const items = supervisorItems();
    const done = items.filter(i => checkState[i.id]).length;
    const missing = items.filter(i => i.star && !checkState[i.id]).length;
    $('progressFill').style.width = Math.round(done / items.length * 100) + '%';
    $('progressLabel').textContent = `${done} / ${items.length} 완료`;
    btn.textContent = missing > 0 ? `중간 저장 (★ ${missing}개 남음)` : '점검 완료 저장';
  } else if (LEADER_INV[role]) {
    const keys = Object.keys(inv);
    const done = keys.filter(k => inv[k].v !== null).length;
    $('progressFill').style.width = (keys.length ? Math.round(done / keys.length * 100) : 0) + '%';
    $('progressLabel').textContent = `재고 입력 ${done} / ${keys.length}`;
    btn.textContent = '재고 저장';
  }
}

// ============================================
// 저장
// ============================================
async function withBusy(label, fn) {
  const btn = $('submitBtn');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  try { await fn(); }
  catch (e) { toast('네트워크 오류 — 저장되지 않았습니다. 다시 눌러주세요.', true); }
  finally { btn.disabled = false; btn.textContent = old; updateProgress(); }
}

// 비밀번호가 바뀌었거나 만료된 경우 다시 묻는다
async function pinCall(r, payload) {
  let pin = getPin(r);
  if (!pin) { pin = await askPin(r); if (!pin) return null; }
  let res = await api(Object.assign({ pin: pin }, payload));
  if (!res.ok && (res.auth || res.locked || res.unset)) {
    setPin(r, '');
    if (res.auth) {
      pin = await askPin(r);
      if (!pin) return null;
      res = await api(Object.assign({ pin: pin }, payload));
    }
  }
  return res;
}

async function submitForm() {
  // ── 대표: 지시사항 저장 ──
  if (role === 'ceo') {
    const txt = $('ceoText').value.trim();
    await withBusy('저장 중…', async () => {
      const res = await pinCall('ceo', { action: 'setNotice', text: txt });
      if (!res) return;
      if (res.ok) {
        ceoNotice = { text: txt, date: '방금' };
        toast(txt ? '✓ 지시사항을 저장했어요' : '✓ 지시사항을 비웠어요');
      } else { toast('저장하지 못했습니다: ' + (res.error || '오류'), true); }
    });
    return;
  }

  // ── 부장: 일일 점검 → 노션 (하루 1건, 다시 저장하면 덮어쓰기) ──
  if (role === 'supervisor') {
    const items = supervisorItems();
    const missing = items.filter(i => i.star && !checkState[i.id]).length;
    const g = id => $(id) ? $(id).value.trim() : '';

    const qItem = items.find(i => i.id === 'sq');
    const qLabels = qItem ? qItem.checks : [];
    const qChecked = qLabels.filter((_, i) => checkState['sub-sq-sub' + i]);
    const qMissing = qLabels.filter((_, i) => !checkState['sub-sq-sub' + i]);
    let qualityText = qChecked.length ? '확인: ' + qChecked.join(', ') : '';
    if (qMissing.length) qualityText += (qualityText ? ' / ' : '') + '미확인: ' + qMissing.join(', ');
    const qmemo = g('memo-sq');
    if (qmemo) qualityText += (qualityText ? ' / ' : '') + '메모: ' + qmemo;

    const data = {
      status: missing > 0 ? 'draft' : 'done',
      s1: !!checkState['s1'],
      s2: !!checkState['s2'],   s2memo: g('memo-s2'),
      wk2: !!checkState['sub-s3-sub0'], memo2: g('memo-s3'),
      wk3: !!(checkState['sub-s4-sub0'] && checkState['sub-s4-sub1']), memo3: g('memo-s4'),
      wk4: !!(checkState['sub-s5-sub0'] && checkState['sub-s5-sub1']), memo4: g('memo-s5'),
      quality: !!checkState['sq'], qualitymemo: qualityText,
      bang: g('num-s6-bang'), ddeok: g('num-s6-ddeok'), butter: g('num-s6-butter'), cream: g('num-s6-cream'),
      hyg: !!checkState['shyg'], hygmemo: g('memo-shyg'),
      preorder: g('num-s8-preorder'), prememo: g('memo-s8'),
      plan: !!checkState['s9'],
      comment: g('memo-s11')
    };
    await withBusy('저장 중…', async () => {
      const res = await pinCall('supervisor', { action: 'saveSupervisor', data: data });
      if (!res) return;
      if (res.ok) toast(missing > 0 ? `✓ 중간 저장했어요 (★ ${missing}개 남음)` : '✓ 오늘 점검을 저장했어요');
      else toast('저장하지 못했습니다: ' + (res.error || '오류'), true);
    });
    return;
  }

  // ── 리더: 재고 → 구글시트 (입력한 품목만) ──
  const floor = role;
  const keys = Object.keys(inv);

  // 아직 확인하지 않은 급변 숫자가 있으면 먼저 확인
  keys.forEach(k => {
    const s = inv[k];
    if (s.mode === 'typed' && !s.ack) s.warn = isOutlier(s.v, invMeta[k].prev);
    paintRow(k);
  });
  const pending = keys.filter(k => inv[k].warn);
  if (pending.length) {
    toast(`확인이 필요한 숫자가 ${pending.length}개 있어요`, true);
    $('inv-' + pending[0]).scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }

  const items = {};
  const dirty = keys.filter(k => inv[k].mode === 'typed' || inv[k].mode === 'same');
  dirty.forEach(k => { items[invMeta[k].name] = inv[k].v; });
  document.querySelectorAll('#extraBox .extra-row').forEach(row => {
    const inps = row.querySelectorAll('input');
    const nm = inps[0].value.replace(/\s+/g, ' ').trim();
    const qt = inps[1].value.trim();
    if (nm && qt !== '') items['[추가] ' + nm] = qt;
  });
  const count = Object.keys(items).length;
  if (!count) { toast('새로 입력한 품목이 없어요', true); return; }

  await withBusy('저장 중…', async () => {
    const res = await api({ action: 'saveInventory', floor: floor, items: items });
    if (res.ok) {
      dirty.forEach(k => { inv[k].mode = 'today'; inv[k].ack = true; });
      $('extraBox').innerHTML = '';
      clearDraft(floor);
      const alerts = keys.filter(k => inv[k].v !== null && inv[k].v < invMeta[k].safe).length;
      const left = keys.filter(k => inv[k].v === null).length;
      let msg = `✓ ${count}개 저장`;
      if (alerts) msg += ` · 긴급 ${alerts}개`;
      if (left) msg += ` · 미입력 ${left}개`;
      toast(msg);
    } else { toast('저장하지 못했습니다: ' + (res.error || '오류'), true); }
  });
}
